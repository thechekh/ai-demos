[project]
name = "ai-demos"
version = "0.1.0"
description = "The runnable demos behind the AI articles on chekh.dev: a small open-weight model, run on a CPU"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=0.30",
    "matplotlib>=3.10",
    "numpy>=2.1",
    "tiktoken>=0.9",
    "torch>=2.6",
    "transformers>=4.50",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

# CPU-only PyTorch: a much smaller download, and everything here runs on a CPU anyway
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
